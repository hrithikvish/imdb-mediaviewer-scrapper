name: Scrape IMDb & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - data   # scraped gallery data (see data.sh); CI's own data commits use [skip ci]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      imdb_input:
        description: 'Paste any text containing IMDb URLs, movie titles, or search links'
        required: true
        type: string
      force_rescrape:
        description: 'Re-scrape title(s) even if already scraped'
        required: false
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one deployment at a time without cancelling running scrapes
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Code always comes from main; the data branch only holds gallery JSON
          ref: ${{ github.ref_name == 'data' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Pull Gallery Data
        run: ./data.sh pull

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Browsers
        if: github.event_name == 'workflow_dispatch'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Python Dependencies
        if: github.event_name == 'workflow_dispatch'
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium with Dependencies
        if: github.event_name == 'workflow_dispatch' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install OS Dependencies Only (Cache Hit)
        if: github.event_name == 'workflow_dispatch' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run Python Scraper & Export Gallery
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TEXT: ${{ github.event.inputs.imdb_input || github.event.inputs.imdb_url }}
          FORCE_RESCRAPE: ${{ github.event.inputs.force_rescrape }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$INPUT_TEXT" ]; then
            echo "Error: imdb_input is required!"
            exit 1
          fi
          mkdir -p build
          printf "%s\n" "$INPUT_TEXT" > build/input_text.txt
          echo "Processing provided input text..."

          EXTRA_ARGS=""
          if [ "$FORCE_RESCRAPE" = "true" ]; then
            echo "⚡ Force re-scrape active: existing titles will be re-scraped and updated."
            EXTRA_ARGS="--force"
          fi

          python3 -u scraper.py --input build/input_text.txt $EXTRA_ARGS

      - name: Publish Gallery Data to data Branch
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          ./data.sh publish "chore: batch update gallery data [skip ci]"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
