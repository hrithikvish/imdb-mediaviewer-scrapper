name: Scrape IMDb & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      imdb_input:
        description: 'Paste any text containing IMDb URLs, movie titles, or search links'
        required: true
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >
        -Xmx3072m
        -Dkotlin.daemon.jvm.options=-Xmx1024m

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Advanced Gradle caching (wrapper, dependencies, build cache)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # Cache Playwright browser binaries to skip ~130MB download on every run
      - name: Cache Playwright Browsers
        if: github.event_name == 'workflow_dispatch'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Chromium with Dependencies
        if: github.event_name == 'workflow_dispatch' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx -y playwright install --with-deps chromium

      - name: Install OS Dependencies Only (Cache Hit)
        if: github.event_name == 'workflow_dispatch' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx -y playwright install-deps chromium

      - name: Run Kotlin Scraper & Export Gallery
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TEXT: ${{ github.event.inputs.imdb_input || github.event.inputs.imdb_url }}
        run: |
          if [ -z "$INPUT_TEXT" ]; then
            echo "Error: imdb_input is required!"
            exit 1
          fi
          mkdir -p build
          printf "%s\n" "$INPUT_TEXT" > build/input_text.txt
          echo "Processing provided input text..."
          ./gradlew run --build-cache --parallel --args="--input build/input_text.txt docs/gallery.json"

      - name: Commit & Push Updated Gallery Data
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: batch update gallery data [skip ci]" && git push)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
